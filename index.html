<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="description" content="Bus Wali Playlist — one-tap Bollywood, New and Bhojpuri playlist modes." />
  <title>Bus Wali Playlist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand-mark">♪</div>
      <div>
        <h1>Bus Wali Playlist</h1>
        <p>Choose a mode. Sit back. Let the playlist roll.</p>
      </div>
    </header>

    <section class="modes" aria-label="Playlist modes">
      <button class="mode-card active" data-mode="90s" aria-pressed="true">
        <span class="mode-number">01</span>
        <span class="mode-name">90s Mode</span>
        <span class="mode-hint">Evergreen Bollywood</span>
      </button>

      <button class="mode-card" data-mode="new" aria-pressed="false">
        <span class="mode-number">02</span>
        <span class="mode-name">New Mode</span>
        <span class="mode-hint">Recent favourites</span>
      </button>

      <button class="mode-card" data-mode="bhojpuri" aria-pressed="false">
        <span class="mode-number">03</span>
        <span class="mode-name">Bhojpuri Mode</span>
        <span class="mode-hint">Bhojpuri playlist</span>
      </button>
    </section>

    <section class="player-shell" aria-label="Music player">
      <div class="now-playing">
        <div class="pulse" id="pulse"></div>
        <div>
          <span class="eyebrow">NOW PLAYING</span>
          <h2 id="modeTitle">90s Mode</h2>
          <p id="status">Tap a mode to start</p>
        </div>
      </div>

      <div class="controls">
        <button class="control" id="prevBtn" aria-label="Previous song" title="Previous song">‹</button>
        <button class="control play" id="playBtn" aria-label="Play" title="Play">
          <span id="playIcon">▶</span>
        </button>
        <button class="control" id="nextBtn" aria-label="Next song" title="Next song">›</button>
      </div>

      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </section>

    <footer>
      <span>Made for long rides.</span>
      <span class="dot">•</span>
      <span>YouTube powered</span>
    </footer>

    <div id="youtube-player" aria-hidden="true"></div>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
